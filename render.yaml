services:
  # 1. Backend FastAPI (Web Service gratuito com Docker)
  - type: web
    name: analisador-curriculo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: analisador-curriculo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: MAX_VAGA_DESCRIPTION_CHARS
        value: "5000"
      - key: CORS_ORIGINS
        value: https://analisador-curriculo-frontend.onrender.com

  # 2. Frontend React SPA (Static Site 100% gratuito)
  - type: web
    name: analisador-curriculo-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://analisador-curriculo-api.onrender.com

databases:
  # 3. PostgreSQL Database (Free Tier no Render)
  - name: analisador-curriculo-db
    databaseName: analisador_curriculos
    user: analisador
    plan: free
    region: ohio
