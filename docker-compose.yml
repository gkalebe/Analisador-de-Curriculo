services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: analisador
      POSTGRES_PASSWORD: analisador
      POSTGRES_DB: analisador_curriculos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analisador -d analisador_curriculos"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://analisador:analisador@db:5432/analisador_curriculos
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
    restart: always
    depends_on:
      - web
    ports:
      - "127.0.0.1:5173:80"

volumes:
  pgdata:
