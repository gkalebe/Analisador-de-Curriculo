services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: analisador
      POSTGRES_PASSWORD: analisador
      POSTGRES_DB: analisador_curriculos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://analisador:analisador@db:5432/analisador_curriculos
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
