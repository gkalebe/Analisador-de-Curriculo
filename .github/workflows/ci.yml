name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test_db
      SECRET_KEY: chave-de-teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: Verify Alembic has exactly one head
        run: |
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | sed '/^[[:space:]]*$/d' | wc -l)"
          if [ "$head_count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $head_count." >&2
            exit 1
          fi
      - name: Verify migrations match models
        run: |
          alembic upgrade head
          alembic check
      - name: Run test suite
        run: pytest
