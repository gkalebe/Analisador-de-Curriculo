name: analisador-de-curriculo-dev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: analisador
      POSTGRES_PASSWORD: analisador
      POSTGRES_DB: analisador_curriculos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analisador -d analisador_curriculos"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://analisador:analisador@db:5432/analisador_curriculos
      WATCHFILES_FORCE_POLLING: "true"
    env_file:
      - .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - web
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    command: sh -c "npm install --legacy-peer-deps --no-fund --no-audit && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:4173:5173"
    volumes:
      - ./frontend:/app


volumes:
  pgdata_dev:
