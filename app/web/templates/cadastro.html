<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta — Analisador de Currículos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <main class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold">Criar conta</h1>
                <p class="text-gray-600 text-sm mt-1">Cadastre-se para acessar o Analisador de Currículos.</p>
            </div>

            <div id="mensagem" class="hidden rounded-md p-3 text-sm"></div>

            <form id="form-cadastro" class="space-y-4">
                <div>
                    <label for="nome" class="block text-sm font-medium mb-1">Nome completo</label>
                    <input type="text" id="nome" name="nome" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="data_nascimento" class="block text-sm font-medium mb-1">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
                    <input type="email" id="email" name="email" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="senha" class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="senha" name="senha" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    <p class="text-xs text-gray-500 mt-1">Mínimo 8 caracteres, 1 letra maiúscula e 1 número.</p>
                </div>
                <button type="submit" id="botao-enviar"
                    class="w-full bg-blue-600 text-white rounded-md py-2 font-medium hover:bg-blue-700 disabled:opacity-50">
                    Criar conta
                </button>
            </form>

            <p class="text-center text-sm text-gray-600">
                Já tem conta? <a href="/login" class="text-blue-600 font-medium hover:underline">Entrar</a>
            </p>
        </div>
    </main>

    <script>
        const form = document.getElementById('form-cadastro');
        const mensagemEl = document.getElementById('mensagem');
        const botao = document.getElementById('botao-enviar');

        function mostrarMensagem(texto, tipo) {
            mensagemEl.textContent = texto;
            mensagemEl.className = 'rounded-md p-3 text-sm ' +
                (tipo === 'erro' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200');
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            botao.disabled = true;
            mensagemEl.classList.add('hidden');

            const payload = {
                nome: document.getElementById('nome').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
            };

            try {
                const resposta = await fetch('/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const corpo = await resposta.json();

                if (resposta.status === 201) {
                    mostrarMensagem('Cadastro realizado! Enviamos um e-mail de confirmação. Redirecionando para o login...', 'sucesso');
                    mensagemEl.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/login'; }, 1800);
                    return;
                }

                if (resposta.status === 409) {
                    mostrarMensagem(corpo.detail, 'erro');
                } else if (resposta.status === 422) {
                    const mensagens = corpo.detail.map((erro) => erro.msg.replace(/^Value error, /, ''));
                    mostrarMensagem(mensagens.join(' '), 'erro');
                } else {
                    mostrarMensagem('Não foi possível concluir o cadastro. Tente novamente.', 'erro');
                }
                mensagemEl.classList.remove('hidden');
            } catch (erro) {
                mostrarMensagem('Falha de conexão com o servidor. Tente novamente.', 'erro');
                mensagemEl.classList.remove('hidden');
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
