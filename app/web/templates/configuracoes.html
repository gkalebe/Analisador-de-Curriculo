<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações — Analisador de Currículos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="settings-wrap">
        <div class="settings-content">
            <header class="settings-header">
                <a class="settings-back" href="/painel">
                    <i class="ti ti-arrow-left" aria-hidden="true"></i>
                    Voltar ao painel
                </a>
                <h1>Configurações</h1>
                <p>Gerencie as informações e as preferências da sua conta.</p>
            </header>

            <section class="settings-card" aria-labelledby="conta-titulo">
                <h2 id="conta-titulo">
                    <i class="ti ti-user-cog" aria-hidden="true"></i>
                    Conta
                </h2>
                <p>As opções da sua conta estarão disponíveis nesta área.</p>
            </section>
        </div>
    </main>

    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = '/login';
        }
    </script>
</body>
</html>
