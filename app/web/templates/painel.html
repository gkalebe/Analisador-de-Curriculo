<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel — Analisador de Currículos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <main class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow p-8 space-y-4 text-center">
            <h1 class="text-2xl font-bold">Bem-vindo(a), <span id="nome-usuario">—</span></h1>
            <p class="text-gray-600 text-sm">
                Este é o painel principal. As funcionalidades completas do painel (histórico e evolução das análises)
                são da US-016, ainda não implementada — esta tela existe para validar o redirecionamento pós-login da US-002.
            </p>
            <button id="botao-sair"
                class="bg-gray-100 text-gray-700 rounded-md py-2 px-4 font-medium hover:bg-gray-200">
                Sair
            </button>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login';
        } else {
            document.getElementById('nome-usuario').textContent = localStorage.getItem('usuario_nome') || 'usuário';
        }

        document.getElementById('botao-sair').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('usuario_nome');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
