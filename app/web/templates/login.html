<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Analisador de Currículos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-hero">
            <a href="/" class="auth-hero-logo">currículo<span>IA</span></a>
            <div>
                <h2>Seu currículo, <em>otimizado</em> para a vaga certa.</h2>
                <p class="auth-hero-sub">Análise inteligente e reestruturação personalizada, sem inventar nada.</p>
            </div>
            <div class="auth-hero-pills">
                <div class="auth-pill"><i class="ti ti-sparkles"></i> Análise com IA em segundos</div>
                <div class="auth-pill"><i class="ti ti-target"></i> Adequado à vaga específica</div>
                <div class="auth-pill"><i class="ti ti-shield-check"></i> Só reescreve, nunca inventa</div>
                <div class="auth-pill"><i class="ti ti-history"></i> Histórico de análises salvo</div>
            </div>
        </div>

        <div class="auth-form-side">
            <a href="/" class="auth-logo-mobile">currículo<span style="font-weight:500;">IA</span></a>

            <div class="auth-tabs">
                <a href="/login" class="auth-tab active">Entrar</a>
                <a href="/cadastro" class="auth-tab">Criar conta</a>
            </div>

            <div id="mensagem" class="alert-box erro"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required />
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn-primary" id="botao-enviar">Entrar na conta</button>
            </form>

            <p class="auth-switch">Não tem conta? <a href="/cadastro">Crie grátis</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('form-login');
        const mensagemEl = document.getElementById('mensagem');
        const botao = document.getElementById('botao-enviar');

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            botao.disabled = true;
            mensagemEl.classList.remove('show');

            const payload = {
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
            };

            try {
                const resposta = await fetch('/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const corpo = await resposta.json();

                if (resposta.status === 200) {
                    localStorage.setItem('access_token', corpo.access_token);
                    localStorage.setItem('usuario_nome', corpo.usuario.nome);
                    window.location.href = '/painel';
                    return;
                }

                // Mensagem sempre genérica — a API não indica qual campo está incorreto.
                mensagemEl.textContent = corpo.detail || 'E-mail ou senha inválidos.';
                mensagemEl.classList.add('show');
            } catch (erro) {
                mensagemEl.textContent = 'Falha de conexão com o servidor. Tente novamente.';
                mensagemEl.classList.add('show');
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
