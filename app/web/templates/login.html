<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Analisador de Currículos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <main class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold">Entrar</h1>
                <p class="text-gray-600 text-sm mt-1">Acesse sua conta do Analisador de Currículos.</p>
            </div>

            <div id="mensagem" class="hidden rounded-md p-3 text-sm bg-red-50 text-red-700 border border-red-200"></div>

            <form id="form-login" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
                    <input type="email" id="email" name="email" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="senha" class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="senha" name="senha" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <button type="submit" id="botao-enviar"
                    class="w-full bg-blue-600 text-white rounded-md py-2 font-medium hover:bg-blue-700 disabled:opacity-50">
                    Entrar
                </button>
            </form>

            <p class="text-center text-sm text-gray-600">
                Não tem conta? <a href="/cadastro" class="text-blue-600 font-medium hover:underline">Criar conta</a>
            </p>
        </div>
    </main>

    <script>
        const form = document.getElementById('form-login');
        const mensagemEl = document.getElementById('mensagem');
        const botao = document.getElementById('botao-enviar');

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            botao.disabled = true;
            mensagemEl.classList.add('hidden');

            const payload = {
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
            };

            try {
                const resposta = await fetch('/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const corpo = await resposta.json();

                if (resposta.status === 200) {
                    localStorage.setItem('access_token', corpo.access_token);
                    localStorage.setItem('usuario_nome', corpo.usuario.nome);
                    window.location.href = '/painel';
                    return;
                }

                // Mensagem sempre genérica — a API não indica qual campo está incorreto.
                mensagemEl.textContent = corpo.detail || 'E-mail ou senha inválidos.';
                mensagemEl.classList.remove('hidden');
            } catch (erro) {
                mensagemEl.textContent = 'Falha de conexão com o servidor. Tente novamente.';
                mensagemEl.classList.remove('hidden');
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
